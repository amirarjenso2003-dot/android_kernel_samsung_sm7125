name: Build Custom OC Kernel A52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Source Code Kernel
      uses: actions/checkout@v4
      with:
        ref: lineage-23.0

    - name: Pasang Alat Kompilasi Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex git-core gnupg gperf curl wget zip

    - name: Cek & Unduh AOSP Clang Compiler
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        
        CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
        
        echo "Mengecek tautan unduhan Clang..."
        # Menggunakan wget --spider untuk mengecek ketersediaan file tanpa mengunduh isinya
        if wget -q --spider "$CLANG_URL"; then
          echo "Tautan tersedia! Mulai mengunduh..."
          wget -q "$CLANG_URL" -O clang-r522817.tar.gz
          tar -xf clang-r522817.tar.gz
          rm clang-r522817.tar.gz
        else
          echo "Error: Tautan Clang tidak ditemukan atau rusak (Gagal merespons)."
          exit 1
        fi

    - name: Proses Compile Kernel & DTB
      run: |
        cd $GITHUB_WORKSPACE
        export ARCH=arm64
        export CLANG_PATH=$GITHUB_WORKSPACE/toolchain/bin
        export PATH=$CLANG_PATH:$PATH
        
