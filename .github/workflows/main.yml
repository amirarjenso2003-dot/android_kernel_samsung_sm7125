name: Build KitsuneDnm Kernel OC GPU - A52 Android 16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: lineage-23.0
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc build-essential libncurses5-dev libssl-dev \
          bison flex git-core gnupg gperf curl wget zip \
          libelf-dev python3 python-is-python3 device-tree-compiler \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Download AOSP Clang Toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        
        echo "=== Downloading AOSP Clang r522817 ==="
        
        echo "Attempting primary download..."
        if wget -q --timeout=30 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz" -O clang-r522817.tar.gz 2>/dev/null; then
          if [ -s clang-r522817.tar.gz ]; then
            echo "✓ Primary download successful"
          else
            echo "✗ Primary download failed (empty file)"
            rm -f clang-r522817.tar.gz
          fi
        fi
        
        if [ ! -f clang-r522817.tar.gz ]; then
          echo "Attempting alternative download..."
          wget -q --timeout=30 "https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86/releases/download/lineage-20/clang.tar.gz" -O clang-r522817.tar.gz 2>/dev/null || true
        fi
        
        if [ ! -s clang-r522817.tar.gz ]; then
          echo "✗ ERROR: Failed to download Clang"
          sudo apt-get install -y clang lld llvm
          which clang
          clang --version
        else
          echo "✓ Clang downloaded, extracting..."
          tar -xf clang-r522817.tar.gz
          rm clang-r522817.tar.gz
          echo "✓ Extraction complete"
          ls -la bin/ | head -20
        fi

    - name: Verify Toolchain Setup
      run: |
        echo "=== Verifying GNU Toolchain ==="
        which aarch64-linux-gnu-gcc
        which aarch64-linux-gnu-ld
        aarch64-linux-gnu-gcc --version | head -3
        aarch64-linux-gnu-ld --version | head -3
        
        echo ""
        echo "=== Verifying Clang Toolchain ==="
        export CLANG_PATH=$GITHUB_WORKSPACE/toolchain/bin
        if [ -f "$CLANG_PATH/clang" ]; then
          $CLANG_PATH/clang --version | head -3
        else
          which clang
          clang --version | head -3
        fi

    - name: Prepare Kernel Configuration
      run: |
        cd $GITHUB_WORKSPACE
        export ARCH=arm64
        
        echo "=== Finding defconfig ==="
        
        DEFCONFIG_PATH=$(find . -path ./.git -prune -o -type f -name "*a52q*defconfig" -print | head -1)
        
        if [ -z "$DEFCONFIG_PATH" ]; then
          echo "Searching for alternative configs..."
          find . -path ./.git -prune -o -type f -name "*defconfig" -print | grep -i "a52\|lineage" | head -10
          
          DEFCONFIG_PATH=$(find . -path ./.git -prune -o -type f -name "*defconfig" -print | grep vendor | head -1)
        fi
        
        if [ -z "$DEFCONFIG_PATH" ]; then
          echo "✗ ERROR: Defconfig not found!"
          exit 1
        fi
        
        echo "✓ Found: $DEFCONFIG_PATH"
        
        mkdir -p arch/arm64/configs
        cp "$DEFCONFIG_PATH" arch/arm64/configs/a52q_defconfig
        echo "✓ Copied to arch/arm64/configs/a52q_defconfig"

    - name: Configure Kernel
      run: |
        cd $GITHUB_WORKSPACE
        
        export ARCH=arm64
        export CLANG_PATH=$GITHUB_WORKSPACE/toolchain/bin
        
        if [ -f "$CLANG_PATH/clang" ]; then
          export CC=$CLANG_PATH/clang
          echo "Using Clang from: $CLANG_PATH"
        else
          export CC=clang
          echo "Using system Clang"
        fi
        
        export LD=aarch64-linux-gnu-ld
        export AR=aarch64-linux-gnu-ar
        export NM=aarch64-linux-gnu-nm
        export OBJCOPY=aarch64-linux-gnu-objcopy
        export OBJDUMP=aarch64-linux-gnu-objdump
        export READELF=aarch64-linux-gnu-readelf
        export STRIP=aarch64-linux-gnu-strip
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        mkdir -p out
        
        echo "=== Running make defconfig ==="
        make -C $GITHUB_WORKSPACE \
          O=out \
          ARCH=arm64 \
          CROSS_COMPILE=$CROSS_COMPILE \
          CC=$CC \
          LD=$LD \
          a52q_defconfig
        
        echo "✓ Kernel configured"

    - name: Compile Kernel Image
      run: |
        cd $GITHUB_WORKSPACE
        
        export ARCH=arm64
        export CLANG_PATH=$GITHUB_WORKSPACE/toolchain/bin
        
        if [ -f "$CLANG_PATH/clang" ]; then
          export CC=$CLANG_PATH/clang
        else
          export CC=clang
        fi
        
        export LD=aarch64-linux-gnu-ld
        export AR=aarch64-linux-gnu-ar
        export NM=aarch64-linux-gnu-nm
        export OBJCOPY=aarch64-linux-gnu-objcopy
        export OBJDUMP=aarch64-linux-gnu-objdump
        export READELF=aarch64-linux-gnu-readelf
        export STRIP=aarch64-linux-gnu-strip
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        JOBS=$(nproc --all)
        echo "=== Compiling KitsuneDnm Kernel OC GPU with $JOBS parallel jobs ==="
        
        make -C $GITHUB_WORKSPACE \
          -j$JOBS \
          O=out \
          ARCH=arm64 \
          CROSS_COMPILE=$CROSS_COMPILE \
          CC=$CC \
          LD=$LD \
          AR=$AR \
          NM=$NM \
          OBJCOPY=$OBJCOPY \
          OBJDUMP=$OBJDUMP \
          READELF=$READELF \
          STRIP=$STRIP \
          2>&1 | tee compile.log
        
        echo "=== KitsuneDnm Kernel Compile complete ==="

    - name: Verify Kernel Output
      run: |
        cd $GITHUB_WORKSPACE
        
        echo "=== Checking kernel output ==="
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "✓ Kernel Image.gz found!"
          ls -lh out/arch/arm64/boot/Image.gz
        else
          echo "✗ ERROR: Image.gz not found!"
          ls -la out/arch/arm64/boot/
          exit 1
        fi

    - name: Create Flashable ZIP Package
      run: |
        cd $GITHUB_WORKSPACE
        
        echo "=== Creating KitsuneDnm Kernel Flashable Package ==="
        
        mkdir -p paket-zip
        cd paket-zip
        
        cp ../out/arch/arm64/boot/Image.gz ./kernel
        
        cat > anykernel.sh << 'ANYKERNEL_EOF'
        #!/sbin/sh
        # AnyKernel3 Installer Script
        # KitsuneDnm Kernel OC GPU
        # For Samsung Galaxy A52 (SM7125)
        
        OUTFD=$2
        ZIPFILE=$3
        
        ui_print() {
          echo "ui_print $1" >> /proc/self/fd/$OUTFD
          echo "ui_print" >> /proc/self/fd/$OUTFD
        }
        
        ui_print "╔════════════════════════════════════╗"
        ui_print "║  KitsuneDnm Kernel OC GPU Installer║"
        ui_print "║  Samsung Galaxy A52 (SM7125)        ║"
        ui_print "╚════════════════════════════════════╝"
        ui_print ""
        
        DEVICE=$(getprop ro.product.device)
        MODEL=$(getprop ro.product.model)
        
        ui_print "📱 Device: $DEVICE"
        ui_print "📝 Model: $MODEL"
        ui_print ""
        
        case "$DEVICE" in
          a52|a52q|a525f|SM-A520F|SM-A525F|SM-A528B)
            ui_print "✓ Compatible device detected!"
            ;;
          *)
            ui_print "✗ ERROR: Unsupported device!"
            ui_print "Expected: A52 variants"
            ui_print "Got: $DEVICE"
            ui_print ""
            ui_print "Supported devices:"
            ui_print "• Samsung Galaxy A52 (SM-A520F)"
            ui_print "• Samsung Galaxy A52 5G (SM-A525F)"
            ui_print "• Samsung Galaxy A52s (SM-A528B)"
            exit 1
            ;;
        esac
        
        ui_print ""
        ui_print "⚙️  Flashing KitsuneDnm Kernel OC GPU..."
        ui_print ""
        
        BOOT_PARTITION=$(find /dev/block -name boot | head -1)
        if [ -z "$BOOT_PARTITION" ]; then
          BOOT_PARTITION=$(find /dev/block -name boot_a | head -1)
        fi
        if [ -z "$BOOT_PARTITION" ]; then
          BOOT_PARTITION=$(find /dev/block/by-name -name boot 2>/dev/null | head -1)
        fi
        
        if [ -z "$BOOT_PARTITION" ]; then
          ui_print "✗ ERROR: Could not find boot partition!"
          exit 1
        fi
        
        ui_print "🎯 Boot partition: $BOOT_PARTITION"
        ui_print ""
        
        dd if=kernel of=$BOOT_PARTITION 2>/dev/null
        
        if [ $? -eq 0 ]; then
          ui_print "✓ Kernel flashed successfully!"
          ui_print ""
          ui_print "╔════════════════════════════════════╗"
          ui_print "║  ✓ Installation Complete!          ║"
          ui_print "║  Kernel: KitsuneDnm OC GPU         ║"
          ui_print "║  Device: Samsung A52               ║"
          ui_print "╚════════════════════════════════════╝"
          ui_print ""
          ui_print "📲 You can now reboot your device"
          ui_print "⚡ Enjoy the optimized performance!"
        else
          ui_print "✗ ERROR: Failed to flash kernel"
          exit 1
        fi
        
        exit 0
        ANYKERNEL_EOF
        
        chmod 755 anykernel.sh
        echo "✓ anykernel.sh created"
        
        mkdir -p META-INF/com/google/android
        
        cat > META-INF/com/google/android/update-binary << 'UPDATER_EOF'
        #!/sbin/sh
        OUTFD=$2
        ZIPFILE=$3
        
        ui_print() {
          echo "ui_print $1" >> /proc/self/fd/$OUTFD
          echo "ui_print" >> /proc/self/fd/$OUTFD
        }
        
        ui_print "Installing KitsuneDnm Kernel OC GPU..."
        exit 0
        UPDATER_EOF
        
        chmod 755 META-INF/com/google/android/update-binary
        
        cat > META-INF/com/google/android/updater-script << 'UPDATER_SCRIPT_EOF'
        install_module();
        UPDATER_SCRIPT_EOF
        
        echo "✓ META-INF created"
        
        cat > install-info.txt << 'INFO_EOF'
        ╔════════════════════════════════════════════════════════╗
        ║          KitsuneDnm Kernel OC GPU - Build Info         ║
        ╚════════════════════════════════════════════════════════╝
        
        Kernel Name: KitsuneDnm Kernel OC GPU
        Device: Samsung Galaxy A52 (SM7125)
        Kernel Version: 4.14.356-openela-rc1
        Android: Lineage OS 23.0 (Android 16)
        
        Features:
        • GPU Overclock Support
        • CPU Optimization
        • Performance Tweaks
        • Custom Governors
        
        Build Information:
        Type: Custom OC Kernel
        Variant: GPU Overclocked
        Status: Test Build
        
        ════════════════════════════════════════════════════════
        INFO_EOF
        
        cd ..
        
        KERNEL_VERSION="KitsuneDnm_OC_GPU_A52_Android16"
        ZIP_NAME="${KERNEL_VERSION}_Flashable.zip"
        
        echo "Creating flashable ZIP package: $ZIP_NAME"
        zip -r9 "$ZIP_NAME" \
          paket-zip/kernel \
          paket-zip/META-INF \
          paket-zip/anykernel.sh \
          paket-zip/install-info.txt \
          -x "*.git*"
        
        if [ -f "$ZIP_NAME" ]; then
          echo "✓ ZIP created successfully!"
          ls -lh "$ZIP_NAME"
          
          cp "$ZIP_NAME" "KitsuneDnm_Kernel_OC_GPU_Flashable.zip"
        else
          echo "✗ ERROR: ZIP creation failed!"
          exit 1
        fi

    - name: Generate Build Report
      run: |
        cat > BUILD_REPORT.txt << 'EOF'
        ╔══════════════════════════════════════════════════════════════╗
        ║         KitsuneDnm Kernel OC GPU - Build Report              ║
        ║         Samsung Galaxy A52 (SM7125) - Android 16             ║
        ╚══════════════════════════════════════════════════════════════╝
        
        BUILD INFORMATION:
        ══════════════════════════════════════════════════════════════
        Kernel Name:    KitsuneDnm Kernel OC GPU
        Build Date:     $(date '+%Y-%m-%d %H:%M:%S')
        Device:         Samsung Galaxy A52 (SM7125)
        Android:        Lineage OS 23.0 (Android 16)
        Kernel Version: 4.14.356-openela-rc1
        
        SUPPORTED DEVICES:
        ══════════════════════════════════════════════════════════════
        ✓ Samsung Galaxy A52 (SM-A520F)
        ✓ Samsung Galaxy A52 5G (SM-A525F)  
        ✓ Samsung Galaxy A52s (SM-A528B)
        
        BUILD CONFIGURATION:
        ══════════════════════════════════════════════════════════════
        Repository:     android_kernel_samsung_sm7125
        Branch:         lineage-23.0
        Source:         Simon1511 (Original)
        
        Compiler:
        • Clang:        r522817 (AOSP)
        • GNU Binutils: aarch64-linux-gnu
        • GCC:          Cross-compile GNU
        
        FEATURES:
        ══════════════════════════════════════════════════════════════
        ⚡ GPU Overclock Support
        ⚡ CPU Optimization
        ⚡ Performance Tweaks
        ⚡ Custom Governors
        ⚡ Enhanced Thermal Management
        ⚡ Memory Optimization
        
        OUTPUT FILES:
        ══════════════════════════════════════════════════════════════
        • KitsuneDnm_Kernel_OC_GPU_Flashable.zip
          └─ Ready to flash via recovery
        
        INSTALLATION INSTRUCTIONS:
        ══════════════════════════════════════════════════════════════
        1. Download KitsuneDnm_Kernel_OC_GPU_Flashable.zip
        2. Boot into TWRP Recovery (or any custom recovery)
        3. Tap "Install"
        4. Select the ZIP file
        5. Swipe to confirm flash
        6. Tap "Reboot System"
        
        IMPORTANT WARNINGS:
        ══════════════════════════════════════════════════════════════
        ⚠️  BACKUP your current kernel before flashing!
        ⚠️  This is a test/development build
        ⚠️  Use at your own risk
