            - Boot into recovery
            - Restore from backup or reinstall ROM
        ⚠️  Overclocking may reduce battery life
        ⚠️  Ensure your device is adequately cooled
        
        BUILD STATUS:
        ══════════════════════════════════════════════════════════════
        ✓ BUILD SUCCESSFUL
        ✓ KERNEL COMPILED
        ✓ FLASHABLE PACKAGE CREATED
        ✓ READY TO FLASH
        
        SUPPORT & FEEDBACK:
        ══════════════════════════════════════════════════════════════
        GitHub:  https://github.com/amirarjenso2003-dot/
        Device:  Samsung Galaxy A52 (SM7125)
        ROM:     Lineage OS 23.0
        
        Report issues or request features on GitHub!
        
        ══════════════════════════════════════════════════════════════
        Built with ❤️ by KitsuneDnm Kernel Development Team
        ══════════════════════════════════════════════════════════════
        EOF
        cat BUILD_REPORT.txt

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KitsuneDnm-Kernel-OC-GPU-A52
        path: |
          KitsuneDnm_Kernel_OC_GPU_Flashable.zip
          BUILD_REPORT.txt
          compile.log
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        name: "KitsuneDnm Kernel OC GPU - A52 Android 16"
        tag_name: "kitsunednm-ocgpu-${{ github.run_number }}"
        body_path: BUILD_REPORT.txt
        files: |
          KitsuneDnm_Kernel_OC_GPU_Flashable.zip
          BUILD_REPORT.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Summary
      if: always()
      run: |
        echo "╔════════════════════════════════════════════════════════════╗"
        echo "║            KitsuneDnm Kernel OC GPU - BUILD SUMMARY        ║"
        echo "║            Samsung Galaxy A52 (SM7125)                     ║"
        echo "╚════════════════════════════════════════════════════════════╝"
        echo ""
        
        if [ -f "KitsuneDnm_Kernel_OC_GPU_Flashable.zip" ]; then
          echo "✓ BUILD SUCCESSFUL!"
          echo "✓ KERNEL COMPILED!"
          echo "✓ FLASHABLE PACKAGE READY!"
          echo ""
          echo "📦 Output File:"
          ls -lh KitsuneDnm_Kernel_OC_GPU_Flashable.zip
          echo ""
          echo "⚡ Ready to flash on Samsung A52!"
          echo "🎯 Features: GPU OC, CPU Optimization, Performance Tweaks"
        else
          echo "✗ BUILD FAILED!"
          echo ""
          echo "Last 100 lines of compile log:"
          tail -100 compile.log || echo "No compile log found"
        fi
        
        echo ""
        echo "════════════════════════════════════════════════════════════"
        echo "Built by: KitsuneDnm Kernel Development"
        echo "Device: Samsung Galaxy A52 (SM7125)"
        echo "Android: Lineage OS 23.0 (Android 16)"
        echo "════════════════════════════════════════════════════════════"