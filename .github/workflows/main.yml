name: Build KitsuneDnm_oc_gpu_700 (Clang)

permissions:
  contents: write
  packages: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install Build Dependencies & Binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex git-core gnupg gperf curl wget zip libelf-dev python3 python-is-python3 device-tree-compiler
          sudo apt-get install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Download AOSP Clang Toolchain
        run: |
          echo "📥 Downloading AOSP Clang r383902..."
          git clone --depth=1 https://gitlab.com/ThankYouMario/android_prebuilts_clang_host_linux-x86_clang-r383902.git clang || \
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078.git clang
          
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          clang --version

      - name: Find and Validate Custom Defconfig
        run: |
          cd $GITHUB_WORKSPACE
          echo "📋 Searching for custom defconfig files..."

          if [ -f "arch/arm64/configs/vendor/lineage-a52q-custom_defconfig" ]; then
            DEFCONFIG="arch/arm64/configs/vendor/lineage-a52q-custom_defconfig"
          elif [ -f "arch/arm64/configs/vendor/lineage-a52q_defconfig" ]; then
            DEFCONFIG="arch/arm64/configs/vendor/lineage-a52q_defconfig"
          else
            DEFCONFIG=$(find . -path ./.git -prune -o -type f -name "*defconfig" -print | head -1)
          fi

          mkdir -p arch/arm64/configs
          cp "$DEFCONFIG" arch/arm64/configs/a52q_defconfig

      - name: Kernel Configuration
        run: |
          cd $GITHUB_WORKSPACE
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p out
          make -C . O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE a52q_defconfig

      - name: Set Kernel Version Name (KitsuneDnm_oc_gpu_700)
        run: |
          cd $GITHUB_WORKSPACE
          sed -i 's/EXTRAVERSION = .*/EXTRAVERSION = -KitsuneDnm_oc_gpu_700/' Makefile
          grep EXTRAVERSION Makefile | head -1

      - name: Clean Reset and Robust Source Patching
        run: |
          cd $GITHUB_WORKSPACE
          git checkout -f
          git clean -fd

          # 1. Patch header magic untuk dlog_hook.c
          if [ -f "fs/dlog_hook.c" ]; then
            sed -i '/#include/a #include <linux/magic.h>' fs/dlog_hook.c || true
            sed -i '/#include "dlog_hook.h"/a #ifndef SDCARDFS_SUPER_MAGIC\n#define SDCARDFS_SUPER_MAGIC 0x5dca\n#endif\n#ifndef SDFAT_SUPER_MAGIC\n#define SDFAT_SUPER_MAGIC 0x6573\n#endif\n#ifndef MSDOS_SUPER_MAGIC\n#define MSDOS_SUPER_MAGIC 0x4d44\n#endif' fs/dlog_hook.c || true
          fi

          # 2. Reset dan patch kernel/bpf/core.c secara akurat (menghindari duplikasi)
          if [ -f "kernel/bpf/core.c" ]; then
            git checkout kernel/bpf/core.c || true
            sed -i 's/div64_u64_rem(DST, IMM, &tmp);/{ u64 tmp = 0; div64_u64_rem(DST, IMM, &tmp); }/g' kernel/bpf/core.c || true
          fi

      - name: Compile Kernel with AOSP Clang
        run: |
          cd $GITHUB_WORKSPACE
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          make -C . -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types" \
            2>&1 | tee compile.log || {
              echo "========================================="
              echo "❌ KOMPILASI GAGAL! INI PESAN ERRORNYA:"
              echo "========================================="
              grep -i "error:" compile.log || tail -n 50 compile.log
              exit 1
            }

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✓ Kernel Image.gz found!"
            ls -lh out/arch/arm64/boot/Image.gz
          else
            echo "✗ ERROR: Image.gz not found!"
            ls -la out/arch/arm64/boot/ || true
            exit 1
          fi

      - name: Build Flashable ZIP
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "ak3" ]; then
            rm -rf ak3
          fi
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image.gz ak3/Image.gz

          cd ak3
          if grep -q "device.name1" anykernel.sh; then
            sed -i 's/device.name1=.*/device.name1=a52q/g' anykernel.sh
          else
            sed -i '/properties() {/a device.name1=a52q;\ndevice.name2=sm7125;' anykernel.sh
          fi

          cd ..
          zip -r9 KitsuneDnm_oc_gpu_700_A52.zip ak3 -x "ak3/.git/*" "ak3/README*" "ak3/LICENSE*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitsuneDnm_oc_gpu_700_A52
          path: |
            KitsuneDnm_oc_gpu_700_A52.zip
            out/arch/arm64/boot/Image.gz
            compile.log
          retention-days: 30