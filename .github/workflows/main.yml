- name: Automated Source Patching for Branch lineage-23.0
        run: |
          cd $GITHUB_WORKSPACE
          git checkout -f
          git clean -fd

          # 1. Patch header magic untuk dlog_hook.c
          python3 -c '
          path = "fs/dlog_hook.c"
          try:
              with open(path, "r") as f:
                  content = f.read()
              if "#include <linux/magic.h>" not in content:
                  content = "#include <linux/magic.h>\n" + content
              magic_defs = """
              #ifndef SDCARDFS_SUPER_MAGIC
              #define SDCARDFS_SUPER_MAGIC 0x5dca
              #endif
              #ifndef SDFAT_SUPER_MAGIC
              #define SDFAT_SUPER_MAGIC 0x6573
              #endif
              #ifndef MSDOS_SUPER_MAGIC
              #define MSDOS_SUPER_MAGIC 0x4d44
              #endif
              """
              if "SDCARDFS_SUPER_MAGIC" not in content:
                  content = content.replace("#include \"dlog_hook.h\"", "#include \"dlog_hook.h\"\n" + magic_defs)
              with open(path, "w") as f:
                  f.write(content)
              print("Successfully patched fs/dlog_hook.c")
          except Exception as e:
              print(f"Skipping fs/dlog_hook.c patch: {e}")
          '

          # 2. Patch kernel/bpf/core.c untuk mendefinisikan variabel tmp yang hilang
          python3 -c '
          path = "kernel/bpf/core.c"
          try:
              with open(path, "r") as f:
                  content = f.read()
              # Cari target fungsi BPF dan tambahkan deklarasi u64 tmp jika belum ada
              target = "div64_u64_rem"
              if target in content and "u64 tmp" not in content:
                  idx = content.find(target)
                  open_brace = content.rfind("{", 0, idx)
                  if open_brace != -1:
                      content = content[:open_brace+1] + "\n\tu64 tmp = 0;" + content[open_brace+1:]
                      with open(path, "w") as f:
                          f.write(content)
                      print("Successfully patched kernel/bpf/core.c with tmp variable")
          except Exception as e:
              print(f"Skipping kernel/bpf/core.c patch: {e}")
          '