name: Build KitsuneDnm_oc_gpu_700

permissions:
  contents: write
  packages: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install Dependencies & GCC 9
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex git-core gnupg gperf curl wget zip libelf-dev python3 python-is-python3 device-tree-compiler
          sudo apt-get install -y gcc-9-aarch64-linux-gnu g++-9-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-9 /usr/bin/aarch64-linux-gnu-g++
          aarch64-linux-gnu-gcc --version

      - name: Find and Validate Custom Defconfig
        run: |
          cd $GITHUB_WORKSPACE
          echo "📋 Searching for custom defconfig files..."

          if [ -f "arch/arm64/configs/vendor/lineage-a52q-custom_defconfig" ]; then
            echo "✓ Found custom defconfig: lineage-a52q-custom_defconfig"
            DEFCONFIG="arch/arm64/configs/vendor/lineage-a52q-custom_defconfig"
            DEFCONFIG_TYPE="CUSTOM"
          elif [ -f "arch/arm64/configs/vendor/lineage-a52q_defconfig" ]; then
            echo "✓ Found A52Q defconfig: lineage-a52q_defconfig"
            DEFCONFIG="arch/arm64/configs/vendor/lineage-a52q_defconfig"
            DEFCONFIG_TYPE="VENDOR"
          else
            DEFCONFIG=$(find . -path ./.git -prune -o -type f -name "*defconfig" -print | head -1)
            DEFCONFIG_TYPE="GENERIC"
            echo "⚠️ Fallback to generic defconfig: $DEFCONFIG"
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "✗ ERROR: No defconfig found!"
            exit 1
          fi

          mkdir -p arch/arm64/configs
          cp "$DEFCONFIG" arch/arm64/configs/a52q_defconfig

          echo "═══════════════════════════════════════════════"
          echo "📦 DEFCONFIG INFORMATION"
          echo "═══════════════════════════════════════════════"
          echo "Type: $DEFCONFIG_TYPE"
          echo "File: $DEFCONFIG"
          echo "Size: $(wc -l < $DEFCONFIG) lines"
          echo "Config: arch/arm64/configs/a52q_defconfig"
          echo "═══════════════════════════════════════════════"

      - name: Kernel Configuration
        run: |
          cd $GITHUB_WORKSPACE
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p out
          make -C . O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE a52q_defconfig

      - name: Update Kernel Name
        run: |
          cd $GITHUB_WORKSPACE
          sed -i 's/EXTRAVERSION = .*/EXTRAVERSION = -KitsuneDnm_oc_gpu_700/' Makefile
          grep EXTRAVERSION Makefile | head -1

      - name: Robust Source Patching for GCC 9
        run: |
          cd $GITHUB_WORKSPACE
          
          # 1. Perbaiki inline di include/linux/mm.h agar tidak error body not available
          if [ -f "include/linux/mm.h" ]; then
            sed -i 's/extern inline bool need_memory_boosting/static inline bool need_memory_boosting/g' include/linux/mm.h || true
          fi

          # 2. Tambahkan deklarasi variabel tmp di kernel/bpf/core.c dengan aman
          if [ -f "kernel/bpf/core.c" ]; then
            sed -i 's/div64_u64_rem(DST, IMM, &tmp);/{ u64 tmp = 0; div64_u64_rem(DST, IMM, &tmp); }/g' kernel/bpf/core.c || true
          fi

          # 3. Perbaiki fungsi waktu kdb_main.c
          if [ -f "kernel/debug/kdb/kdb_main.c" ]; then
            sed -i 's/now = __current_kernel_time();/struct timespec64 ts64 = current_kernel_time64(); now = timespec64_to_timespec(ts64);/g' kernel/debug/kdb/kdb_main.c || true
          fi

      - name: Compile Kernel (GCC 9 Mode)
        run: |
          cd $GITHUB_WORKSPACE
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Menambahkan -fcommon dan flag kompatibilitas GCC 9 lainnya
          make -C . -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE \
            KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -fgnu89-inline -std=gnu89 -fcommon" \
            2>&1 | tee compile.log || {
              echo "========================================="
              echo "❌ KOMPILASI GAGAL! INI PESAN ERRORNYA:"
              echo "========================================="
              grep -i "error:" compile.log || tail -n 50 compile.log
              exit 1
            }

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✓ Kernel Image.gz found!"
            ls -lh out/arch/arm64/boot/Image.gz
          else
            echo "✗ ERROR: Image.gz not found!"
            ls -la out/arch/arm64/boot/ || true
            exit 1
          fi

      - name: Build Flashable ZIP
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "ak3" ]; then
            rm -rf ak3
          fi
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image.gz ak3/Image.gz

          cd ak3
          if grep -q "device.name1" anykernel.sh; then
            sed -i 's/device.name1=.*/device.name1=a52q/g' anykernel.sh
          else
            sed -i '/properties() {/a device.name1=a52q;\ndevice.name2=sm7125;' anykernel.sh
          fi

          cd ..
          zip -r9 KitsuneDnm_oc_gpu_700_A52.zip ak3 -x "ak3/.git/*" "ak3/README*" "ak3/LICENSE*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitsuneDnm_oc_gpu_700_A52
          path: |
            KitsuneDnm_oc_gpu_700_A52.zip
            out/arch/arm64/boot/Image.gz
            compile.log
          retention-days: 30