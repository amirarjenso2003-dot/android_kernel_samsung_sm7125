name: Build KitsuneDnm_oc_gpu_700 Kernel - A52 Android 16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: lineage-23.0
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc build-essential libncurses5-dev libssl-dev \
          bison flex git-core gnupg gperf curl wget zip \
          libelf-dev python3 python-is-python3 device-tree-compiler \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Download Clang toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain

        echo "Downloading clang r522817..."
        if wget -q --timeout=30 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz" -O clang.tar.gz 2>/dev/null; then
          if [ -s clang.tar.gz ]; then
            echo "Primary download ok"
            tar -xf clang.tar.gz
            rm -f clang.tar.gz
          fi
        fi

        if [ ! -f "$GITHUB_WORKSPACE/toolchain/bin/clang" ]; then
          echo "Fallback to alternative clang mirror..."
          wget -q --timeout=30 "https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86/releases/download/lineage-20/clang.tar.gz" -O clang.tar.gz || true
          if [ -s clang.tar.gz ]; then
            tar -xf clang.tar.gz
            rm -f clang.tar.gz
          fi
        fi

        if [ ! -f "$GITHUB_WORKSPACE/toolchain/bin/clang" ]; then
          echo "Clang download failed. Falling back to system clang..."
          sudo apt-get install -y clang lld llvm
        fi

        echo "Toolchain ready"
        ls -la $GITHUB_WORKSPACE/toolchain/bin | head

    - name: Find defconfig
      run: |
        cd $GITHUB_WORKSPACE

        DEFCONFIG=$(find . -path ./.git -prune -o -type f -name "*a52q*defconfig" -print | head -1)
        if [ -z "$DEFCONFIG" ]; then
          DEFCONFIG=$(find . -path ./.git -prune -o -type f -name "*defconfig" -print | grep -i "a52\|lineage" | head -1)
        fi

        if [ -z "$DEFCONFIG" ]; then
          echo "Defconfig not found"
          exit 1
        fi

        echo "Using defconfig: $DEFCONFIG"
        mkdir -p arch/arm64/configs
        cp "$DEFCONFIG" arch/arm64/configs/a52q_defconfig

    - name: Configure kernel
      run: |
        cd $GITHUB_WORKSPACE

        export ARCH=arm64
        export CLANG_PATH=$GITHUB_WORKSPACE/toolchain/bin
        if [ -f "$CLANG_PATH/clang" ]; then
          export CC="$CLANG_PATH/clang"
        else
          export CC="clang"
        fi

        export CROSS_COMPILE=aarch64-linux-gnu-
        export LD=aarch64-linux-gnu-ld
        export AR=aarch64-linux-gnu-ar
        export NM=aarch64-linux-gnu-nm
        export OBJCOPY=aarch64-linux-gnu-objcopy
        export OBJDUMP=aarch64-linux-gnu-objdump
        export READELF=aarch64-linux-gnu-readelf
        export STRIP=aarch64-linux-gnu-strip

        mkdir -p out

        make -C $GITHUB_WORKSPACE \
          O=out \
          ARCH=arm64 \
          CROSS_COMPILE=$CROSS_COMPILE \
          CC=$CC \
          LD=$LD \
          a52q_defconfig

    - name: Set kernel name
      run: |
        cd $GITHUB_WORKSPACE

        sed -i 's/EXTRAVERSION = .*/EXTRAVERSION = -KitsuneDnm_oc_gpu_700/' Makefile
        grep "EXTRAVERSION" Makefile | head -1

    - name: Compile kernel
      run: |
        cd $GITHUB_WORKSPACE

        export ARCH=arm64
        export CLANG_PATH=$GITHUB_WORKSPACE/toolchain/bin
        if [ -f "$CLANG_PATH/clang" ]; then
          export CC="$CLANG_PATH/clang"
        else
          export CC="clang"
        fi

        export CROSS_COMPILE=aarch64-linux-gnu-
        export LD=aarch64-linux-gnu-ld
        export AR=aarch64-linux-gnu-ar
        export NM=aarch64-linux-gnu-nm
        export OBJCOPY=aarch64-linux-gnu-objcopy
        export OBJDUMP=aarch64-linux-gnu-objdump
        export READELF=aarch64-linux-gnu-readelf
        export STRIP=aarch64-linux-gnu-strip

        make -C $GITHUB_WORKSPACE \
          -j$(nproc --all) \
          O=out \
          ARCH=arm64 \
          CROSS_COMPILE=$CROSS_COMPILE \
          CC=$CC \
          LD=$LD \
          AR=$AR \
          NM=$NM \
          OBJCOPY=$OBJCOPY \
          OBJDUMP=$OBJDUMP \
          READELF=$READELF \
          STRIP=$STRIP \
          2>&1 | tee compile.log

    - name: Verify image exists
      run: |
        cd $GITHUB_WORKSPACE

        if [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "Kernel image not found"
          ls -la out/arch/arm64/boot || true
          exit 1
        fi

        ls -lh out/arch/arm64/boot/Image.gz

    - name: Build valid AnyKernel3 ZIP
      run: |
        cd $GITHUB_WORKSPACE

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

        cp out/arch/arm64/boot/Image.gz anykernel/Image.gz

        cd anykernel

        # Optional: set branding in anykernel.sh
        sed -i 's|^# AnyKernel3|# KitsuneDnm_oc_gpu_700 Kernel|' anykernel.sh || true
        sed -i 's|^#.*Kernel.*|# KitsuneDnm_oc_gpu_700 Kernel|' anykernel.sh || true

        # Create valid zip from AnyKernel3 root
        zip -r9 ../KitsuneDnm_oc_gpu_700_A52_Flashable.zip . \
          -x ".git/*" ".github/*" "README.md" "LICENSE" ".gitignore"

        cd ..

        ls -lh KitsuneDnm_oc_gpu_700_A52_Flashable.zip
        unzip -t KitsuneDnm_oc_gpu_700_A52_Flashable.zip | head -20

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: KitsuneDnm_oc_gpu_700_A52
        path: |
          KitsuneDnm_oc_gpu_700_A52_Flashable.zip
          compile.log
        retention-days: 30

    - name: Build summary
      if: always()
      run: |
        echo "==================================="
        echo "KitsuneDnm_oc_gpu_700 Kernel Build"
        echo "==================================="
        echo ""
        if [ -f "KitsuneDnm_oc_gpu_700_A52_Flashable.zip" ]; then
          echo "ZIP OK"
          ls -lh KitsuneDnm_oc_gpu_700_A52_Flashable.zip
        else
          echo "ZIP NOT CREATED"
          tail -50 compile.log || true
        fi