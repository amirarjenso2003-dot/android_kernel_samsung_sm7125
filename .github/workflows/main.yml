
name: Build Custom OC Kernel A52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Source Code Kernel
      uses: actions/checkout@v4
      with:
        ref: lineage-23.0

    - name: Pasang Alat Kompilasi Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex git-core gnupg gperf curl wget zip

    - name: Cek & Unduh AOSP Clang Compiler
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        
        CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
        
        echo "Mengecek tautan unduhan Clang..."
        if wget -q --spider "$CLANG_URL"; then
          echo "Tautan tersedia! Mulai mengunduh..."
          wget -q "$CLANG_URL" -O clang-r522817.tar.gz
          tar -xf clang-r522817.tar.gz
          rm clang-r522817.tar.gz
        else
          echo "Error: Tautan Clang tidak ditemukan atau rusak."
          exit 1
        fi

    - name: Proses Compile Kernel & DTB
      run: |
        cd $GITHUB_WORKSPACE
        export ARCH=arm64
        export CLANG_PATH=$GITHUB_WORKSPACE/toolchain/bin
        export PATH=$CLANG_PATH:$PATH
        
        mkdir -p out
        
        # Cari file defconfig secara otomatis di arch/arm64/configs
        DEFCONFIG=$(find arch/arm64/configs -type f \( -name "*a52q*defconfig" -o -name "*sm7125*defconfig" \) | head -n 1 | sed 's|arch/arm64/configs/||')
        
        if test -z "$DEFCONFIG"; then
          echo "Error: File defconfig tidak ditemukan!"
          exit 1
        fi
        
        echo "Menggunakan defconfig: $DEFCONFIG"
        
        make O=out $DEFCONFIG
        make -j$(nproc --all) O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi-

    - name: Cek AnyKernel3 & Buat Flashable ZIP
      run: |
        cd $GITHUB_WORKSPACE
        ANYKERNEL_URL="https://github.com/osm0sis/AnyKernel3.git"
        
        echo "Mengecek repositori AnyKernel3..."
        if git ls-remote "$ANYKERNEL_URL" &> /dev/null; then
          echo "Repositori ditemukan! Mulai melakukan kloning..."
          git clone "$ANYKERNEL_URL" paket-zip
        else
          echo "Error: Repositori AnyKernel3 tidak ditemukan atau diprivat."
          exit 1
        fi
        
        # Memindahkan file biner hasil compile ke dalam template
        cp out/arch/arm64/boot/Image.gz paket-zip/
        cp out/arch/arm64/boot/dts/qcom/*.dtb paket-zip/ 2>/dev/null || true
        
        # Konfigurasi jalur partisi boot block
        cd paket-zip
        sed -i 's/block=\/dev\/block\/bootdevice\/by-name\/boot;/block=\/dev\/block\/by-name\/boot;/g' anykernel.sh
        
        # Mengemas seluruh folder
        zip -r9 ../Kernel_OC_700MHz_A52_Flashable.zip * -x .git* README.md

    - name: Unggah ZIP Jadi Siap Flash
      uses: actions/upload-artifact@v4
      with:
        name: Kernel_OC_700MHz_A52_Flashable
        path: Kernel_OC_700MHz_A52_Flashable.zip