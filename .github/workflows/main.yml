name: Build KitsuneDnm_oc_gpu_700

permissions:
  contents: write
  packages: write
  actions: write

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev bison flex git-core gnupg gperf curl wget zip libelf-dev python3 python-is-python3 device-tree-compiler gcc-aarch64-linux-gnu

      - name: Download Clang
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          if wget -q --timeout=30 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz" -O clang.tar.gz 2>/dev/null; then
            if [ -s clang.tar.gz ]; then
              echo "✓ Primary download successful"
              tar -xf clang.tar.gz
            else
              echo "✗ Primary download failed (empty file)"
              rm -f clang.tar.gz
              wget -q --timeout=30 "https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86/releases/download/lineage-20/clang.tar.gz" -O clang.tar.gz 2>/dev/null || true
              if [ -s clang.tar.gz ]; then
                tar -xf clang.tar.gz
              fi
            fi
          else
            wget -q --timeout=30 "https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86/releases/download/lineage-20/clang.tar.gz" -O clang.tar.gz 2>/dev/null || true
            if [ -s clang.tar.gz ]; then
              tar -xf clang.tar.gz
            else
              echo "✗ ERROR: Failed to download Clang"
              sudo apt-get install -y clang lld llvm
              which clang
              clang --version
            fi
          fi

      - name: Find and Validate Custom Defconfig
        run: |
          cd $GITHUB_WORKSPACE
          echo "📋 Searching for custom defconfig files..."

          if [ -f "arch/arm64/configs/vendor/lineage-a52q-custom_defconfig" ]; then
            echo "✓ Found custom defconfig: lineage-a52q-custom_defconfig"
            DEFCONFIG="arch/arm64/configs/vendor/lineage-a52q-custom_defconfig"
            DEFCONFIG_TYPE="CUSTOM"
          elif [ -f "arch/arm64/configs/vendor/lineage-a52q_defconfig" ]; then
            echo "✓ Found A52Q defconfig: lineage-a52q_defconfig"
            DEFCONFIG="arch/arm64/configs/vendor/lineage-a52q_defconfig"
            DEFCONFIG_TYPE="VENDOR"
          else
            DEFCONFIG=$(find . -path ./.git -prune -o -type f -name "*defconfig" -print | head -1)
            DEFCONFIG_TYPE="GENERIC"
            echo "⚠️ Fallback to generic defconfig: $DEFCONFIG"
          fi

          if [ -z "$DEFCONFIG" ]; then
            echo "✗ ERROR: No defconfig found!"
            exit 1
          fi

          mkdir -p arch/arm64/configs
          cp "$DEFCONFIG" arch/arm64/configs/a52q_defconfig

          echo "═══════════════════════════════════════════════"
          echo "📦 DEFCONFIG INFORMATION"
          echo "═══════════════════════════════════════════════"
          echo "Type: $DEFCONFIG_TYPE"
          echo "File: $DEFCONFIG"
          echo "Size: $(wc -l < $DEFCONFIG) lines"
          echo "Config: arch/arm64/configs/a52q_defconfig"
          echo "═══════════════════════════════════════════════"

      - name: Kernel Configuration
        run: |
          cd $GITHUB_WORKSPACE
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p out
          make -C . O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE a52q_defconfig

      - name: Update Kernel Name
        run: |
          cd $GITHUB_WORKSPACE
          sed -i 's/EXTRAVERSION = .*/EXTRAVERSION = -KitsuneDnm_oc_gpu_700/' Makefile
          grep EXTRAVERSION Makefile | head -1

      - name: Patch Makefile for Clang Warnings
        run: |
          cd $GITHUB_WORKSPACE
          # Menghapus -Werror dan menambahkan flag pengabaian implicit-function-declaration
          sed -i 's/-Werror//g' Makefile
          echo "KBUILD_CFLAGS += -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types" >> Makefile

      - name: Compile Kernel
        run: |
          cd $GITHUB_WORKSPACE
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_PATH=$GITHUB_WORKSPACE/toolchain/bin
          [ -f "$CLANG_PATH/clang" ] && export CC="$CLANG_PATH/clang" || export CC="clang"

          make -C . -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE CC=$CC \
            LD=aarch64-linux-gnu-ld AR=aarch64-linux-gnu-ar NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip 2>&1 | tee compile.log || {
              echo "========================================="
              echo "❌ KOMPILASI GAGAL! INI PESAN ERRORNYA:"
              echo "========================================="
              grep -i "error:" compile.log || tail -n 50 compile.log
              exit 1
            }

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✓ Kernel Image.gz found!"
            ls -lh out/arch/arm64/boot/Image.gz
          else
            echo "✗ ERROR: Image.gz not found!"
            ls -la out/arch/arm64/boot/ || true
            exit 1
          fi

      - name: Build Flashable ZIP
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "ak3" ]; then
            rm -rf ak3
          fi
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image.gz ak3/Image.gz

          cd ak3
          if grep -q "device.name1" anykernel.sh; then
            sed -i 's/device.name1=.*/device.name1=a52q/g' anykernel.sh
          else
            sed -i '/properties() {/a device.name1=a52q;\ndevice.name2=sm7125;' anykernel.sh
          fi

          cd ..
          zip -r9 KitsuneDnm_oc_gpu_700_A52.zip ak3 -x "ak3/.git/*" "ak3/README*" "ak3/LICENSE*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitsuneDnm_oc_gpu_700_A52
          path: |
            KitsuneDnm_oc_gpu_700_A52.zip
            out/arch/arm64/boot/Image.gz
            compile.log
          retention-days: 30